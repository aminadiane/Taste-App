<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/tokens/colors.css">
  <link rel="stylesheet" href="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/tokens/typography.css">
  <link rel="stylesheet" href="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/tokens/base.css">
  <link rel="stylesheet" href="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/styles.css">
  <script src="_ds/creative-output-design-system-ca443838-334a-4774-b349-fec337126a32/_ds_bundle.js"></script>
  <style>html,body{background:#F4F4F2;margin:0} a{color:var(--ink)} a:hover{color:var(--ink)}</style>
</helmet>
<section style="padding:80px;display:flex;flex-direction:column;gap:40px;">
  <p style="margin:0;font-family:var(--font-sans);font-variation-settings:'wdth' 112;font-size:13px;font-weight:500;color:var(--graphite);">pallas on mobile — 390 × 844, live screens from Taste v2</p>
  <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start;">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <p style="margin:0;font-family:var(--font-sans);font-variation-settings:'wdth' 112;font-size:13px;font-weight:500;color:var(--ink);">{{ s.label }}</p>
        <div style="width:390px;height:844px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #0b0b0b,0 30px 60px -20px rgba(0,0,0,.35);">
          <iframe src="{{ s.src }}" title="{{ s.label }}" style="width:390px;height:844px;border:0;display:block;"></iframe>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { screens: [
      { label: 'home', src: 'Taste v2.dc.html' },
      { label: 'film', src: 'Taste v2.dc.html#cinema' },
      { label: 'literature', src: 'Taste v2.dc.html#literature' },
      { label: 'taste profile', src: 'Taste Profile.dc.html?m=film#1b' },
    ] };
  }
}
</script>
</body>
</html>
